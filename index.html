<!DOCTYPE html>
<html lang="ru" data-theme="corporate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор отмазок</title>
<style>
  :root, [data-theme="corporate"] {
    --bg: #F5F7FA;
    --card-bg: #FFFFFF;
    --text: #2D3748;
    --text-muted: #718096;
    --btn-primary: #3182CE;
    --btn-primary-hover: #2C5282;
    --btn-secondary: #E2E8F0;
    --success: #48BB78;
    --accent: #3182CE;
    --border-radius: 14px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --shadow: 0 4px 12px rgba(0,0,0,0.05);
  }

  [data-theme="tyler"] {
    --bg: #1A1A1A;
    --card-bg: #2D2D2D;
    --text: #E0E0E0;
    --text-muted: #9E9E9E;
    --btn-primary: #D32F2F;
    --btn-primary-hover: #B71C1C;
    --btn-secondary: #424242;
    --success: #FFC107;
    --accent: #FFC107;
    --border-radius: 2px;
    --font: 'Courier New', monospace;
    --shadow: 0 4px 12px rgba(211, 47, 47, 0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 20px;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .container { max-width: 640px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding: 16px 0;
  }

  .logo {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  [data-theme="tyler"] .logo {
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .theme-switch {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .theme-switch-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
  }

  [data-theme="tyler"] .theme-switch-label {
    color: var(--accent);
    text-transform: uppercase;
  }

  .toggle {
    width: 52px;
    height: 28px;
    background: var(--btn-secondary);
    border-radius: 14px;
    position: relative;
    transition: background 0.3s;
  }

  [data-theme="tyler"] .toggle {
    background: #424242;
    border: 1px solid var(--btn-primary);
  }

  .toggle::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    background: var(--btn-primary);
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  [data-theme="tyler"] .toggle::after {
    transform: translateX(24px);
    border-radius: 2px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    transition: all 0.4s ease;
  }

  [data-theme="tyler"] .card {
    border: 1px solid #3D3D3D;
    box-shadow: none;
  }

  .card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  [data-theme="tyler"] .card-title {
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
  }

  .form-group { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  select, textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--btn-secondary);
    border-radius: var(--border-radius);
    font-family: var(--font);
    font-size: 15px;
    transition: all 0.2s;
  }

  select:focus, textarea:focus {
    outline: none;
    border-color: var(--btn-primary);
  }

  textarea { resize: vertical; min-height: 80px; }

  .btn {
    padding: 14px 28px;
    font-family: var(--font);
    font-weight: 700;
    font-size: 15px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: var(--border-radius);
    width: 100%;
  }

  .btn-primary {
    background: var(--btn-primary);
    color: #FFFFFF;
  }

  .btn-primary:hover {
    background: var(--btn-primary-hover);
    transform: translateY(-1px);
  }

  [data-theme="tyler"] .btn-primary {
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 22px 36px;
    border-radius: 0;
    clip-path: polygon(
      0% 10%, 2% 0%, 10% 6%, 18% 0%, 28% 4%, 38% 0%,
      48% 7%, 58% 0%, 68% 5%, 78% 0%, 88% 6%, 96% 0%, 100% 12%,
      100% 28%, 97% 42%, 100% 58%, 98% 72%, 100% 86%, 97% 100%,
      88% 94%, 78% 100%, 68% 95%, 58% 100%, 48% 93%, 38% 100%,
      28% 96%, 18% 100%, 10% 94%, 2% 100%, 0% 88%,
      3% 72%, 0% 58%, 2% 42%, 0% 28%
    );
  }

  [data-theme="tyler"] .btn-primary:hover {
    background: var(--btn-primary-hover);
    transform: none;
    animation: shake 0.3s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-2px, 1px) rotate(-0.5deg); }
    50% { transform: translate(2px, -1px) rotate(0.5deg); }
    75% { transform: translate(-1px, 2px) rotate(-0.3deg); }
  }

  .result-card {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
    animation: slideIn 0.4s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  [data-theme="tyler"] .result-card {
    border: 1px solid #3D3D3D;
    border-left: 4px solid var(--btn-primary);
  }

  .result-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .result-text {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }

  .result-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .credibility {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--btn-secondary);
    color: var(--text);
  }

  [data-theme="tyler"] .credibility {
    background: var(--btn-primary);
    color: #fff;
    border-radius: 0;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--btn-primary);
    color: var(--btn-primary);
    padding: 6px 14px;
    border-radius: var(--border-radius);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .copy-btn:hover {
    background: var(--btn-primary);
    color: #fff;
  }

  .copy-btn.copied {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }

  .tyler-task {
    background: #1A1A1A;
    border: 2px dashed var(--btn-primary);
    color: var(--text);
    padding: 20px;
    border-radius: 0;
    margin-top: 20px;
    animation: flicker 2s infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.92; }
  }

  .tyler-task-title {
    color: var(--btn-primary);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    font-weight: 800;
  }

  .tyler-task-text {
    font-size: 14px;
    line-height: 1.5;
    font-style: italic;
  }

  .tyler-quote {
    background: var(--card-bg);
    border-left: 4px solid var(--btn-primary);
    padding: 16px 20px;
    margin-top: 16px;
    font-style: italic;
    font-size: 14px;
    line-height: 1.5;
  }

  .tyler-quote::before { content: '« '; color: var(--btn-primary); font-size: 24px; font-weight: bold; }
  .tyler-quote::after { content: ' »'; color: var(--btn-primary); font-size: 24px; font-weight: bold; }

  .hidden { display: none; }

  .disclaimer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 32px;
    padding: 16px;
    opacity: 0.7;
  }

  .regen-hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: -10px;
    margin-bottom: 16px;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo" id="logo">Генератор отмазок</div>
    <div class="theme-switch" id="themeSwitch">
      <span class="theme-switch-label" id="themeLabel">Тайлер</span>
      <div class="toggle"></div>
    </div>
  </header>

  <div class="card">
    <div class="card-title" id="formTitle">Опиши ситуацию</div>

    <div class="form-group">
      <label>Кому пишем?</label>
      <select id="recipient">
        <option value="boss">Начальнику</option>
        <option value="client">Клиенту</option>
        <option value="colleague">Коллеге</option>
        <option value="teacher">Преподавателю</option>
        <option value="friend">Другу</option>
        <option value="partner">Партнёру / второй половинке</option>
      </select>
    </div>

    <div class="form-group">
      <label>Что нужно?</label>
      <select id="goal">
        <option value="late">Опоздать</option>
        <option value="reschedule">Перенести встречу</option>
        <option value="refuse">Отказаться</option>
        <option value="missed">Объяснить, что забыл/не сделал</option>
      </select>
    </div>

    <div class="form-group">
      <label>Реальная причина (коротко)</label>
      <textarea id="realReason" placeholder="Например: просрал всё, что можно..."></textarea>
    </div>

    <button class="btn btn-primary" id="generateBtn">Сгенерировать</button>
  </div>

  <div id="results" class="hidden"></div>

  <div class="disclaimer">
    Работает без интернета · Тысячи уникальных комбинаций · Используй ответственно
  </div>
</div>

<script>
  // ===== ПЕРЕКЛЮЧЕНИЕ ТЕМЫ =====
  const themeSwitch = document.getElementById('themeSwitch');
  const html = document.documentElement;
  const logo = document.getElementById('logo');
  const themeLabel = document.getElementById('themeLabel');
  const formTitle = document.getElementById('formTitle');

  themeSwitch.addEventListener('click', () => {
    const isTyler = html.getAttribute('data-theme') === 'tyler';
    html.setAttribute('data-theme', isTyler ? 'corporate' : 'tyler');
    logo.textContent = isTyler ? 'Генератор отмазок' : 'ПРОЕКТ РАЗГРОМ';
    themeLabel.textContent = isTyler ? 'Тайлер' : 'Корп. режим';
    formTitle.textContent = isTyler ? 'Опиши ситуацию' : 'ЧТО СЛУЧИЛОСЬ, ЧУВАК?';

    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = isTyler ? 200 : 800;
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
  });

  // ===== УТИЛИТЫ =====
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  // ===== АНАЛИЗ ПРИЧИНЫ =====
  function analyzeReason(reason) {
    if (!reason || reason.trim().length < 3) return 'unknown';
    const r = reason.toLowerCase();
    const categories = {
      'sleep': ['проспал', 'спал', 'будильник', 'не выспал', 'устал', 'выгор', 'нет сил', 'лениво', 'лень', 'не хочу вставать'],
      'party': ['пил', 'алкогол', 'похмель', 'тусил', 'вечеринк', 'бар', 'клуб', 'гулял', 'набухал'],
      'games': ['играл', 'игр', 'доту', 'кс', 'playstation', 'приставку', 'сериал', 'нетфликс', 'youtube', 'залип'],
      'health': ['бол', 'температур', 'простуд', 'отравл', 'тошн', 'голова', 'живот', 'аллерг', 'врач', 'больниц'],
      'transport': ['пробк', 'транспорт', 'метро', 'автобус', 'маршрутк', 'такси', 'машина', 'сломал', 'авари', 'дорог'],
      'family': ['семь', 'мама', 'папа', 'родител', 'ребенок', 'дет', 'жена', 'муж', 'брат', 'сестр'],
      'mood': ['депрес', 'грустн', 'плохое настроен', 'нет настроен', 'не хочу', 'не могу', 'стресс', 'тревог', 'паник'],
      'honest': ['забил', 'похуй', 'не хочу', 'не интересно', 'бесит', 'ненавиж', 'достал', 'надоел']
    };
    for (const [cat, kws] of Object.entries(categories)) {
      if (kws.some(kw => r.includes(kw))) return cat;
    }
    return 'custom';
  }

  // ===== ШАБЛОНЫ ПО СИТУАЦИИ И ПОЛУЧАТЕЛЮ =====
  const templates = {
    corporate: {
      late: {

  // ===== ЦИТАТЫ И ЗАДАНИЯ ТАЙЛЕРА =====

  // ===== ГЕНЕРАЦИЯ =====
  function generateExcuse(theme, recipient, goal, reason) {
    const reasonCategory = analyzeReason(reason);
    const details = reasonDetails[reasonCategory][theme];
    const detail = pick(details);
    const time = rand(10, 60);
    
    const templatePool = templates[theme][goal][recipient];
    const template = pick(templatePool);
    
    const text = template(detail, time);
    
    // Индекс убедительности
    let credibility;
    if (theme === 'corporate') {
      // Зависит от категории причины
      const credByCategory = {
        'health': [88, 98], 'transport': [80, 92], 'family': [85, 95],
        'sleep': [65, 80], 'party': [75, 90], 'games': [55, 75],
        'mood': [60, 78], 'honest': [45, 65], 'custom': [65, 85], 'unknown': [65, 85]
      };
      const [min, max] = credByCategory[reasonCategory];
      credibility = rand(min, max);
    } else {
      // В режиме Тайлера — "шанс быть понятым"
      const credByCategory = {
        'health': [55, 75], 'family': [60, 80], 'transport': [40, 60],
        'sleep': [15, 35], 'party': [10, 30], 'games': [10, 25],
        'mood': [35, 55], 'honest': [5, 20], 'custom': [15, 35], 'unknown': [15, 35]
      };
      const [min, max] = credByCategory[reasonCategory];
      credibility = rand(min, max);
    }
    
    return { text, credibility };
  }

  // ===== ОБРАБОТКА КНОПКИ =====
  const generateBtn = document.getElementById('generateBtn');
  const results = document.getElementById('results');

  generateBtn.addEventListener('click', () => {
    const theme = html.getAttribute('data-theme');
    const recipient = document.getElementById('recipient').value;
    const goal = document.getElementById('goal').value;
    const realReason = document.getElementById('realReason').value.trim();

    results.classList.remove('hidden');
    results.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">Генерирую...</div>';

    setTimeout(() => {
      const variants = [
        generateExcuse(theme, recipient, goal, realReason),
        generateExcuse(theme, recipient, goal, realReason),
        generateExcuse(theme, recipient, goal, realReason)
      ];

      let html_content = '';
      const labels = theme === 'corporate'
        ? ['Официальный', 'Сбалансированный', 'Мягкий']
        : ['ФИЛОСОФСКИЙ', 'ДЕРЗКИЙ', 'РАДИКАЛЬНЫЙ'];

      variants.forEach((item, i) => {
        const credLabel = theme === 'corporate'
          ? `Убедительность: ${item.credibility}%`
          : `Шанс быть понятым: ${item.credibility}%`;

        html_content += `
          <div class="result-card">
            <div class="result-label">${labels[i]} вариант</div>
            <div class="result-text">${item.text}</div>
            <div class="result-footer">
              <span class="credibility">${credLabel}</span>
              <button class="copy-btn" data-text="${item.text.replace(/"/g, '&quot;')}">Копировать</button>
            </div>
          </div>
        `;
      });

      if (theme === 'tyler') {
        const quote = pick(tylerQuotes);
        html_content += `<div class="tyler-quote">${quote}</div>`;

        const task = pick(tylerTasks);
        html_content += `
          <div class="tyler-task">
            <div class="tyler-task-title">🥊 Домашнее задание от Тайлера</div>
            <div class="tyler-task-text">${task}</div>
          </div>
        `;
      }

      html_content += '<div class="regen-hint">Не нравится? Нажми ещё раз — каждый вариант уникален</div>';

      results.innerHTML = html_content;

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(btn.dataset.text);
          btn.textContent = '✓ Скопировано';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Копировать';
            btn.classList.remove('copied');
          }, 2000);
        });
      });
    }, 300);
  });
